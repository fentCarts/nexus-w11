IC.nexus=sv(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a9fff"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient></defs><circle cx="16" cy="16" r="15" fill="url(#g)"/><path d="M10 22V10l12 12V10" stroke="#fff" stroke-width="3" fill="none"/></svg>`);
const WPS=(()=>{
const H='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">';
const blur=(id,s)=>`<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
// Windows 11 style bloom: layered rotated petals
const bloom=(cx,cy,sc,c1,c2,c3,op=1)=>{
 let g=`<g transform="translate(${cx} ${cy}) scale(${sc})" opacity="${op}">`;
 const cs=[c1,c2,c3,c2,c1,c3];
 for(let i=0;i<6;i++){g+=`<g transform="rotate(${i*60+12})"><path d="M0 0C-150 -90 -190 -330 -40 -470C90 -580 240 -470 230 -300C220 -150 110 -40 0 0Z" fill="${cs[i]}" opacity="${i%2?0.82:0.92}" filter="url(#bl)"/></g>`}
 g+=`<g transform="rotate(30)"><path d="M10 -40C60 -200 180 -380 90 -470" stroke="#fff" stroke-opacity=".4" stroke-width="9" fill="none" filter="url(#bl2)"/></g><circle r="60" fill="#bfe6ff" opacity=".55" filter="url(#bl2)"/>`;
 g+='</g>';return g};
const bloomDefs=`${blur('bl',5)}${blur('bl2',9)}${blur('bl3',60)}
<linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fc3ff"/><stop offset="1" stop-color="#0a3fd6"/></linearGradient>
<linearGradient id="p2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a7bff"/><stop offset="1" stop-color="#0a2aa8"/></linearGradient>
<linearGradient id="p3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1a5cff"/><stop offset="1" stop-color="#8fd4ff"/></linearGradient>`;
const w0=H+`<defs>${bloomDefs}<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9dcec"/><stop offset=".6" stop-color="#b3cde3"/><stop offset="1" stop-color="#9fbfdc"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><ellipse cx="1250" cy="620" rx="520" ry="360" fill="#fff" opacity=".35" filter="url(#bl3)"/>${bloom(1180,540,1.15,'url(#p1)','url(#p2)','url(#p3)')}`+'</svg>';
const w1=H+`<defs>${bloomDefs}<radialGradient id="bg" cx=".62" cy=".6" r=".9"><stop offset="0" stop-color="#0b2a55"/><stop offset=".5" stop-color="#06122b"/><stop offset="1" stop-color="#02050f"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><ellipse cx="1250" cy="620" rx="520" ry="360" fill="#1a5cff" opacity=".35" filter="url(#bl3)"/>${bloom(1180,540,1.15,'url(#p1)','url(#p2)','url(#p3)')}`+'</svg>';
// sky with clouds
const cloud=(x,y,s,o)=>`<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}" filter="url(#cb)"><ellipse rx="260" ry="48" fill="#fff"/><ellipse cx="-120" cy="-30" rx="150" ry="52" fill="#fff"/><ellipse cx="80" cy="-44" rx="170" ry="58" fill="#fff"/><ellipse cx="190" cy="-6" rx="130" ry="40" fill="#fff"/></g>`;
const w2=H+`<defs>${blur('cb',14)}<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f78d6"/><stop offset=".55" stop-color="#7fb6ec"/><stop offset="1" stop-color="#dcebf8"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#sk)"/>${cloud(380,300,1.6,.9)}${cloud(1500,220,1.3,.8)}${cloud(980,520,2.2,.85)}${cloud(260,760,1.8,.9)}${cloud(1650,700,2,.9)}${cloud(900,900,2.6,.95)}`+'</svg>';
// purple glow
const w3=H+`<defs>${blur('gb',80)}<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05020d"/><stop offset=".6" stop-color="#14052e"/><stop offset="1" stop-color="#2a0a5e"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><ellipse cx="1700" cy="1000" rx="700" ry="380" fill="#9b30ff" opacity=".7" filter="url(#gb)"/><ellipse cx="1500" cy="1100" rx="500" ry="240" fill="#ff4fa8" opacity=".45" filter="url(#gb)"/><ellipse cx="300" cy="100" rx="500" ry="260" fill="#3a1b8a" opacity=".5" filter="url(#gb)"/>`+'</svg>';

 $$('.wall:not(#lock)').forEach(w=>w.style.background=`url("${L.p}") center/cover`);

function loadPhoto(file,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1920/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};i.src=r.result};r.readAsDataURL(file)}

$('#tnc').onclick=e=>{e.stopPropagation();toggle('#nc');if($('#nc').style.display=='block')qsMain()};
$('#tnc').oncontextmenu=e=>{e.preventDefault();e.stopPropagation();hideAll();showContextMenu(e.clientX,e.clientY,[['Open Sound settings',()=>openApp('settings')],[Q.mute?'Unmute':'Mute',()=>{Q.mute=!Q.mute;setGain();qsRefresh()}],['Network & Internet settings',()=>openApp('settings')]])};
$('#tnc').onwheel=e=>{e.preventDefault();Q.vol=Math.max(0,Math.min(100,Q.vol+(e.deltaY<0?2:-2)));if(Q.vol>0)Q.mute=false;setGain();qsRefresh()};
$('#clk').title='Date and time';
// taskbar
const DEFPINS=['filezilla','opera','settings','notepad','term','files','photos','store','steam','chrome'];
let PINNED=(()=>{try{const p=JSON.parse(localStorage.getItem('pins'));if(Array.isArray(p))return p.filter((k,i)=>(APPS[k]||EXTRA[k])&&p.indexOf(k)==i)}catch(e){}return DEFPINS.slice()})(),dragK=null;
const savePins=()=>{try{localStorage.setItem('pins',JSON.stringify(PINNED))}catch(e){}};
const pinTog=k=>{const i=PINNED.indexOf(k);i<0?PINNED.push(k):PINNED.splice(i,1);savePins();renderTb();toast(i<0?'Pinned to taskbar':'Unpinned from taskbar')};
function renderTb(){const c=$('#tbc');c.innerHTML='';const top=topWin();
const st=el(`<div class="ti" title="Start">${ico('start')}</div>`);st.onclick=e=>{e.stopPropagation();toggle('#start')};c.append(st);
const sp=el(`<div class="tsearch" title="Search">${S(P.search,16)}<span>Search</span></div>`);sp.onclick=e=>{e.stopPropagation();toggle('#start');$('#ss').focus()};c.append(sp);
const keys=[...PINNED,...wins.map(w=>w.k).filter((k,i,a)=>!PINNED.includes(k)&&a.indexOf(k)==i)];
keys.forEach(k=>{const A=APPS[k],E=EXTRA[k],name=A?A[0]:E[0],icon=A?A[1]:ico(k),ws=A?wins.filter(w=>w.k==k):[],act=ws.some(w=>w.el==top),pinned=PINNED.includes(k);
const launch=()=>{if(A)openApp(k);else{window.NAVTO=E[1];openApp('chrome')}};
const t=el(`<div class="ti ${ws.length?'on':''} ${act?'act':''}" title="${name}" draggable="${pinned}">${icon}</div>`);
t.onclick=e=>{e.stopPropagation();hideAll();if(!ws.length)return launch();if(act&&ws.length==1){ws[0].el.classList.add('mn');renderTb()}else focusWin(ws.find(w=>w.el!=top)||ws[0])};
t.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();hideAll();showContextMenu(e.clientX,e.clientY,[[ws.length?'New window':'Open '+name,launch],[pinned?'Unpin from taskbar':'Pin to taskbar',()=>pinTog(k)],...(ws.length?[['Close window'+(ws.length>1?'s':''),()=>ws.slice().forEach(w=>w.close())]]:[])])};
t.ondragstart=e=>{dragK=k;e.dataTransfer.setData('text/plain',k)};t.ondragend=()=>dragK=null;
t.ondragover=e=>{if(dragK&&pinned)e.preventDefault()};
t.ondrop=e=>{e.preventDefault();if(!dragK||dragK==k||!pinned)return;const from=PINNED.indexOf(dragK),to=PINNED.indexOf(k);PINNED.splice(from,1);PINNED.splice(to,0,dragK);dragK=null;savePins();renderTb()};
c.append(t)})}
setDark(true);renderTb();drawTray();
</script></body></html>
